  omega: 1.0     # near resonance
target:
  type: constant
  value: 0.0
noise:
  type: gaussian
  std: 0.0
sim:
  t0: 0.0
  t_max: 60.0
  n_steps: 6000
  x0: 0.0
  v0: 0.0
